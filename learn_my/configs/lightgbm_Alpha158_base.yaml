# 后续操作：关闭涨跌停 + CSRankNorm + 收盘价
experiment_name: lightgbm_alpha158_test
# run_name 不填会自动随机
# run_name: 
tags:
    desc: &desc 关闭涨跌停 + CSRankNorm + 收盘价
description: *desc
# ==============================================================================
qlib_init:
    provider_uri: "C:\\Users\\WANGKANG\\.qlib\\qlib_data\\my_tushare_data"
    region: cn
    limit_threshold: null
market: &market zb
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2010-01-01
    end_time: 2026-09-01
    fit_start_time: 2010-01-01
    fit_end_time: 2019-12-31
    instruments: *market
    # label:
    #     - ["Ref($open, -2) / Ref($open, -1) - 1"]
    #     - ["LABEL0"]
    # raw: ["$total_mv", "$industry", "$is_ST", "$list_status"]
    # shared_processors 同时作用于训练集和推理/回测数据，统一剔除非正常上市及 ST 股票。
    # shared_processors:
        # - class: StockFilterProcessor
    # 先对 Alpha158 特征做每日横截面的行业 + 对数总市值中性化。
    # 中性化后的 infer 数据也是 learn 数据的输入（Alpha158 默认 process_type=append）。
    # infer_processors:
    #     - class: CSNeutralize
    # 让模型拟合排名，而不是未来收益
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 2
            # 必须加，防止策略因为股票退市导致无法卖出从而卡死无法交易
            only_tradable: true
    backtest:
        start_time: 2023-01-01
        end_time: 2026-09-01
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            # limit_threshold: 0.095
            limit_threshold: null
            # deal_price: open
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2010-01-01, 2019-12-31]
                valid: [2020-01-01, 2022-12-31]
                test: [2023-01-01, 2026-09-01]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
