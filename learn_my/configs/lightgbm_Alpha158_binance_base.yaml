experiment_name: lightgbm_alpha158_binance
# run_name 不填会自动随机
# run_name: 
tags:
    desc: &desc CSRankNorm + 开盘价
description: *desc
# ==============================================================================
qlib_init:
    provider_uri: "C:\\Users\\WANGKANG\\.qlib\\qlib_data\\binance_data"
    region: us
    limit_threshold: null
market: &market all
benchmark: &benchmark BTC
data_handler_config: &data_handler_config
    start_time: 2020-01-01
    end_time: 2026-09-01
    fit_start_time: 2020-01-01
    fit_end_time: 2024-12-31
    instruments: *market
    label:
        - ["Ref($open, -2) / Ref($open, -1) - 1"]
        - ["LABEL0"]
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 10
            only_tradable: true
    backtest:
        start_time: 2026-01-01
        end_time: 2026-09-01
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null
            deal_price: open
            # deal_price: close
            open_cost: 0.0005
            close_cost: 0.0002
            # min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-01-01, 2024-12-31]
                valid: [2025-01-01, 2025-12-31]
                test: [2026-01-01, 2026-09-01]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: true
            ann_scaler: 365
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
